# ─────────────────────────────────────────────────────────────────────────────
# CI — qualité et non-régression (priorité 4, corrigée après premier run réel)
#
# Correctif bootstrap (voir docs/RAPPORT-CORRECTIF-CI-BOOTSTRAP-POSTGRES-SEED.md) :
# l'ordre est désormais strictement  PostgreSQL healthy → dépendances → Prisma
# generate/validate → migrate deploy → clé éphémère → SEED → vérification du
# seed → Vitest → typecheck/lint/builds. Le premier run a montré que les tests
# d'intégration (RBAC, notifications, pagination) exigent une base seedée.
#
# Secrets : aucun secret réel ici — base jetable, clé AES générée à chaque
# exécution, mot de passe de démo éphémère propre à la CI.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qualite:
    name: Qualité & non-régression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parc_it_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parc_it_ci"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Base jetable de CI — la seule utilisée par Prisma, le seed et Vitest.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parc_it_ci?schema=public

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Attente de PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres -d parc_it_ci && exit 0
            sleep 1
          done
          echo "PostgreSQL indisponible après 30 s" >&2
          exit 1

      - name: Installation des dépendances backend
        working-directory: backend
        run: npm ci

      - name: Installation des dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Génération du client Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Validation du schéma Prisma
        working-directory: backend
        run: npx prisma validate

      - name: Application des migrations sur la base de CI
        working-directory: backend
        run: npx prisma migrate deploy

      # Clé AES-256-GCM éphémère : chiffrement des PIN/PUK par le seed et les
      # tests de chiffrement. Régénérée à chaque exécution, jamais persistée.
      - name: Clé de chiffrement éphémère pour la CI
        run: 'echo "CLE_CHIFFREMENT=$(node -e "console.log(require(''crypto'').randomBytes(32).toString(''base64''))")" >> "$GITHUB_ENV"'

      - name: Seed de la base de test
        working-directory: backend
        env:
          NODE_ENV: test
          AUTORISER_SEED_DEMO: "true"
          MOT_DE_PASSE_DEMO: Ci-Test-Password-2026
        run: npm run db:seed

      - name: Vérification du seed (comptes et référentiels présents)
        working-directory: backend
        run: |
          # Le script vit dans backend/ pour résoudre @prisma/client.
          cat > check-seed.tmp.cjs <<'EOF'
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();
          (async () => {
            const roles = await prisma.role.count();
            const permissions = await prisma.permission.count();
            const rolePermissions = await prisma.rolePermission.count();
            const utilisateurs = await prisma.utilisateur.count();
            console.log(JSON.stringify({ roles, permissions, rolePermissions, utilisateurs }));
            const manques = [];
            if (roles === 0) manques.push("roles");
            if (permissions === 0) manques.push("permissions");
            if (rolePermissions === 0) manques.push("role_permissions");
            if (utilisateurs === 0) manques.push("utilisateurs");
            if (manques.length > 0) {
              console.error("Seed incomplet — tables vides : " + manques.join(", "));
              process.exit(1);
            }
            await prisma.$disconnect();
          })().catch((e) => { console.error(e.message); process.exit(1); });
          EOF
          node check-seed.tmp.cjs; statut=$?; rm -f check-seed.tmp.cjs; exit $statut

      - name: Tests Vitest (backend)
        working-directory: backend
        run: npm test

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
